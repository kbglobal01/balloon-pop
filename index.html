<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풍선 대장</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one full-screen sky canvas; scoreboard pinned to the top, menus float as round cards in the middle. Single bright daytime look on purpose. */
:root {
  --sky-top: #63c4ff;
  --sky-bot: #d2f2ff;
  --ink: #1d3557;
  --ink-soft: #4a6584;
  --card: #ffffff;
  --card-edge: #bfe6ff;
  --sun: #ffd23f;
  --sun-deep: #f2a900;
  --pink: #ff6fa5;
  --red: #ff4d5e;
  --blue: #3d8bff;
  --yellow: #ffd23f;
  --green: #35c96a;
  --gold: #ffc21a;
  --warn: #ff3b4f;
  --display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: "Gowun Dodum", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-bot);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: var(--display); color: var(--ink); cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- scoreboard ---------- */
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud-box {
  justify-self: start;
  display: flex; flex-direction: column; align-items: center;
  min-width: 4.6em;
  padding: 6px clamp(10px, 3vw, 20px) 4px;
  background: var(--card);
  border: 4px solid var(--card-edge);
  border-radius: 26px;
  box-shadow: 0 6px 0 rgba(29, 53, 87, .14);
  font-family: var(--display);
}
.hud-box.score { justify-self: end; background: #fff7d1; border-color: var(--sun); }
.hud-label { font-size: clamp(15px, 3.6vw, 22px); color: var(--ink-soft); line-height: 1.1; }
.hud-num { display: flex; align-items: baseline; gap: 2px; line-height: 1; }
.hud-num b { font-weight: 400; font-size: clamp(40px, 11vw, 80px); font-variant-numeric: tabular-nums; }
.hud-num small { font-size: clamp(16px, 3.8vw, 26px); color: var(--ink-soft); }
#timeBox.hurry { background: #ffe1e5; border-color: var(--warn); animation: pulse .5s ease-in-out infinite alternate; }
#timeBox.hurry b { color: var(--warn); }
.hud-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; font-family: var(--display); }
.chip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px;
  background: var(--card); border: 3px solid var(--chip, var(--card-edge));
  font-size: clamp(14px, 3.4vw, 20px); line-height: 1.2; text-align: center;
}
.chip b { font-weight: 400; }
.chip .dot { flex: none; width: .9em; height: 1.05em; border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; background: var(--chip); display: inline-block; }
.missed { font-size: clamp(14px, 3.4vw, 20px); color: var(--ink-soft); background: rgba(255,255,255,.75); padding: 3px 12px; border-radius: 999px; text-align: center; line-height: 1.2; }
.missed b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }

.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
.hud-box.score.shake { background: #ffe1e5; border-color: var(--warn); }
.bump b { animation: bump .28s ease-out; }
@keyframes shake {
  10%, 90% { transform: translateX(-3px) rotate(-1deg); }
  20%, 80% { transform: translateX(6px) rotate(2deg); }
  30%, 50%, 70% { transform: translateX(-12px) rotate(-3deg); }
  40%, 60% { transform: translateX(12px) rotate(3deg); }
}
@keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

/* ---------- screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: safe center;
  gap: 14px;
  overflow-y: auto;
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen.dim { background: rgba(29, 53, 87, .35); z-index: 20; }
.card {
  width: 100%; max-width: 520px; box-sizing: border-box;
  background: var(--card);
  border: 5px solid var(--card-edge);
  border-radius: 36px;
  box-shadow: 0 10px 0 rgba(29, 53, 87, .15);
  padding: 22px 24px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  text-align: center;
}
.kicker { margin: 0; font-family: var(--display); font-size: 20px; color: var(--pink); letter-spacing: .04em; }
h1 {
  margin: -6px 0 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(44px, 12vw, 68px); line-height: 1.05; text-wrap: balance;
  color: var(--blue);
  text-shadow: 0 4px 0 #cfe6ff;
}
h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 42px); color: var(--ink); text-wrap: balance; }
.balloon-row { display: flex; gap: 10px; justify-content: center; align-items: flex-end; height: 56px; }
.mini {
  --c: var(--red);
  position: relative; display: inline-block; width: 30px; height: 36px;
  background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.75) 0 14%, transparent 15%), var(--c);
  border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
  animation: bob 2.4s ease-in-out infinite;
}
.mini::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 16px; background: rgba(29,53,87,.35); transform: translateX(-50%); }
.mini:nth-child(2) { animation-delay: -.5s; } .mini:nth-child(3) { animation-delay: -1s; } .mini:nth-child(4) { animation-delay: -1.5s; } .mini:nth-child(5) { animation-delay: -2s; }
.mini.star { width: 36px; height: 43px; }
.mini.star::before { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; line-height: 1; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: clamp(18px, 4.6vw, 21px); line-height: 1.35; }
.rules b { font-family: var(--display); font-weight: 400; color: var(--pink); }
.rules .gold b { color: var(--sun-deep); }

.field { width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.field-label { font-family: var(--display); font-size: 18px; color: var(--ink-soft); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #eaf6ff; padding: 6px; border-radius: 24px; }
.seg button {
  font-size: 24px; padding: 10px 0; border: 0; border-radius: 18px; background: transparent; color: var(--ink-soft);
}
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; box-shadow: 0 4px 0 #1f63d6; }
.pick {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 24px; padding: 12px 16px; border-radius: 24px;
  background: #fff; border: 4px dashed var(--chip, #9fd3f7);
}
.pick .dot { width: 26px; height: 31px; border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; background: var(--chip); }
.today-rule { margin: -4px 0 0; font-size: 18px; color: var(--ink); background: #fff3f6; border-radius: 16px; padding: 8px 14px; line-height: 1.4; }
.today-rule b { font-family: var(--display); font-weight: 400; color: var(--warn); }

.big-btn {
  width: 100%;
  font-size: clamp(32px, 9vw, 42px); padding: 12px 0 14px;
  border: 0; border-radius: 28px;
  background: var(--pink); color: #fff;
  box-shadow: 0 7px 0 #d94a83;
  transition: transform .08s;
}
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #d94a83; }
.ghost {
  font-size: 19px; padding: 10px 16px; border-radius: 20px;
  background: #eef8ff; border: 3px solid var(--card-edge); color: var(--ink);
}
.row-small { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
.row-small .ghost { flex: 1 1 140px; }

/* picker */
.swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
.sw {
  --c: var(--red);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 6px 12px; border-radius: 26px;
  background: #fff; border: 4px solid var(--c);
  font-size: 28px;
}
.sw .ball {
  width: 58px; height: 68px; border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
  background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.75) 0 13%, transparent 14%), var(--c);
}
.sw[aria-pressed="true"] { background: var(--c); color: #fff; }
.sw[aria-pressed="true"] .ball { box-shadow: 0 0 0 4px #fff; }
.note { margin: 0; font-size: 18px; line-height: 1.45; color: var(--ink-soft); }

/* countdown */
.count {
  position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-size: clamp(120px, 34vw, 260px); color: #fff;
  -webkit-text-stroke: .05em var(--blue); paint-order: stroke fill;
  text-shadow: 0 .05em 0 rgba(29,53,87,.2);
}
.count span { animation: zoom .7s ease-out both; }
.count span.go { font-size: .55em; color: var(--sun); -webkit-text-stroke-color: var(--pink); }
@keyframes zoom { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* end */
#end { pointer-events: none; }
#end .card { pointer-events: auto; max-width: 440px; }
.champ {
  margin: 0; font-family: var(--display); font-weight: 400; line-height: 1;
  font-size: clamp(72px, 19vw, 200px); white-space: nowrap;
  color: var(--gold);
  -webkit-text-stroke: .07em #fff; paint-order: stroke fill;
  filter: drop-shadow(0 .05em 0 #e2861a) drop-shadow(0 .09em 0 rgba(29,53,87,.22));
}
.champ span { display: inline-block; animation: hop .9s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes hop { 0% { transform: translateY(80%) scale(.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
.champ.dance span { animation: wiggle 1.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10%) rotate(3deg); } }
.final { margin: 0; font-family: var(--display); font-size: 28px; color: var(--ink-soft); }
.final b { font-weight: 400; font-size: 84px; line-height: 1; color: var(--pink); font-variant-numeric: tabular-nums; }
.stats { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.stats span { font-size: 18px; background: #eef8ff; border-radius: 999px; padding: 5px 14px; }
.stats b { font-family: var(--display); font-weight: 400; color: var(--ink); }
.btns { display: flex; flex-direction: column; gap: 12px; width: 100%; }

/* qr */
.qr-img { width: min(260px, 70vw); height: auto; aspect-ratio: 1; max-width: 100%; border-radius: 18px; border: 4px solid var(--card-edge); background: #fff; }
.url { margin: 0; font-size: 14px; color: var(--ink-soft); word-break: break-all; -webkit-user-select: text; user-select: text; }

@media (prefers-reduced-motion: reduce) {
  .mini, .champ span, .champ.dance span, #timeBox.hurry { animation: none; }
}
</style>
</head>
<body>

<canvas id="sky" aria-label="풍선이 올라오는 하늘. 풍선을 눌러 터뜨리세요."></canvas>

<header id="hud" hidden>
  <div class="hud-box" id="timeBox"><span class="hud-label">남은 시간</span><span class="hud-num"><b id="timeNum">30</b><small>초</small></span></div>
  <div class="hud-mid">
    <div class="chip" id="todayChip" hidden><i class="dot"></i><span>오늘의 색 <b id="todayChipText">빨강</b></span></div>
    <div class="missed">놓친 풍선 <b id="missNum">0</b></div>
  </div>
  <div class="hud-box score" id="scoreBox"><span class="hud-label">점수</span><span class="hud-num"><b id="scoreNum">0</b><small>점</small></span></div>
</header>

<section id="menu" class="screen">
  <div class="card">
    <div class="balloon-row" aria-hidden="true">
      <i class="mini" style="--c: var(--red)"></i><i class="mini" style="--c: var(--blue)"></i><i class="mini star" style="--c: var(--gold)"></i><i class="mini" style="--c: var(--yellow)"></i><i class="mini" style="--c: var(--green)"></i>
    </div>
    <p class="kicker">하늘 높이 둥실둥실</p>
    <h1>풍선 터뜨리기</h1>
    <ul class="rules">
      <li>풍선을 누르면 <b>펑! +1점</b></li>
      <li class="gold">금색 별풍선은 언제나 <b>+3점</b></li>
      <li>위로 날아가 버리면 놓쳐요</li>
      <li>한 판은 <b>30초</b></li>
    </ul>
    <div class="field">
      <span class="field-label">속도 고르기</span>
      <div class="seg" role="group" aria-label="속도">
        <button id="spSlow" type="button" aria-pressed="true">천천히</button>
        <button id="spNormal" type="button" aria-pressed="false">보통</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">오늘의 색</span>
      <button id="pickBtn" class="pick" type="button"><i class="dot" hidden></i><span id="pickText">오늘의 색 고르기</span></button>
    </div>
    <p id="todayRule" class="today-rule" hidden></p>
    <button id="startBtn" class="big-btn" type="button">시작</button>
    <div class="row-small">
      <button id="soundBtn" class="ghost" type="button">소리 켜짐</button>
      <button id="qrBtn" class="ghost" type="button">휴대폰으로 하기</button>
    </div>
  </div>
</section>

<section id="picker" class="screen dim" hidden>
  <div class="card">
    <h2>오늘의 색 고르기</h2>
    <p class="note">고른 색 풍선만 눌러요.<br>다른 색을 누르면 <b>앗! -1점</b>이에요.</p>
    <div class="swatches">
      <button class="sw" type="button" data-color="red" style="--c: var(--red)"><i class="ball"></i>빨강</button>
      <button class="sw" type="button" data-color="blue" style="--c: var(--blue)"><i class="ball"></i>파랑</button>
      <button class="sw" type="button" data-color="yellow" style="--c: var(--yellow)"><i class="ball"></i>노랑</button>
      <button class="sw" type="button" data-color="green" style="--c: var(--green)"><i class="ball"></i>초록</button>
    </div>
    <button class="ghost" type="button" data-color="" id="noPick" style="width:100%">안 고를래요 (모든 색 +1점)</button>
  </div>
</section>

<section id="qr" class="screen dim" hidden>
  <div class="card">
    <h2>휴대폰으로 하기</h2>
    <p class="note">휴대폰 카메라로 QR코드를 찍어 보세요.</p>
    <img id="qrImg" class="qr-img" alt="풍선 터뜨리기 게임 주소 QR코드" src="">
    <p class="url" id="qrUrl"></p>
    <div class="btns">
      <button id="copyBtn" class="ghost" type="button">주소 복사하기</button>
      <button id="qrClose" class="big-btn" type="button">닫기</button>
    </div>
  </div>
</section>

<div id="count" class="count" hidden></div>

<section id="end" class="screen" hidden>
  <h2 class="champ" id="champ" aria-label="풍선 대장!"></h2>
  <div class="card">
    <p class="final"><b id="finalScore">0</b> 점</p>
    <p class="stats" id="stats"></p>
    <div class="btns">
      <button id="againBtn" class="big-btn" type="button">다시하기</button>
      <button id="homeBtn" class="ghost" type="button">처음으로</button>
    </div>
  </div>
</section>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  const sfx = {
    pop: popSound,
    star() { popSound(); [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, 0.05 + i * 0.06, 0.22, "sine", 0.14)); },
    oops() { tone(330, 0, 0.16, "square", 0.08); tone(220, 0.14, 0.26, "square", 0.08); },
    beep(hi) { tone(hi ? 1046 : 660, 0, hi ? 0.35 : 0.16, "triangle", 0.2); },
    fanfare() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, i * 0.13, i === 5 ? 0.6 : 0.16, "triangle", 0.18)); }
  };

  // ---------- HUD ----------
  function renderScore(kind) {
    scoreNum.textContent = score;
    if (kind === "shake") flash(scoreBox, "shake");
    if (kind === "bump") flash(scoreBox, "bump");
  }
  function renderTime() {
    const t = Math.max(0, Math.ceil(timeLeft));
    if (t !== shownTime) { shownTime = t; timeNum.textContent = t; }
    timeBox.classList.toggle("hurry", state === "play" && t <= 5);
  }
  function renderToday() {
    const chip = $("todayChip"), pickBtn = $("pickBtn"), rule = $("todayRule");
    const dot = pickBtn.querySelector(".dot");
    if (todayColor) {
      const c = COLORS[todayColor];
      chip.hidden = false; chip.style.setProperty("--chip", c.fill);
      $("todayChipText").textContent = c.name;
      pickBtn.style.setProperty("--chip", c.fill); dot.hidden = false;
      $("pickText").textContent = `오늘의 색: ${c.name} (바꾸기)`;
      rule.hidden = false;
      rule.innerHTML = `<b>${c.name}</b> 풍선만 눌러요! 다른 색을 누르면 <b>앗! -1점</b>`;
    } else {
      chip.hidden = true;
      pickBtn.style.removeProperty("--chip"); dot.hidden = true;
      $("pickText").textContent = "오늘의 색 고르기";
      rule.hidden = true;
    }
    document.querySelectorAll(".sw").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.color === todayColor)));
  }

  // ---------- flow ----------
  function show(id, on) { $(id).hidden = !on; }
  function startGame() {
    audio();
    score = 0; popped = 0; missed = 0; mistakes = 0; stars = 0; timeLeft = ROUND; shownTime = -1;
    balloons = []; bits = []; texts = [];
    renderScore(); missNum.textContent = "0"; renderTime(); renderToday();
    show("menu", false); show("end", false); show("hud", true);
    $("champ").classList.remove("dance");
    state = "count";
    const box = $("count"); box.hidden = false;
    const steps = ["3", "2", "1", "시작!"];
    let i = 0;
    const next = () => {
      if (state !== "count") return;
      if (i < steps.length) {
        const last = i === steps.length - 1;
        box.innerHTML = `<span class="${last ? "go" : ""}">${steps[i]}</span>`;
        sfx.beep(last);
        i++;
        setTimeout(next, last ? 500 : 700);
      } else {
        box.hidden = true; box.innerHTML = "";
        state = "play"; spawnTimer = 0;
      }
    };
    next();
  }
  function endGame() {
    state = "end"; timeLeft = 0; renderTime();
    partyAge = 0; partyTimer = 0;
    for (let i = 0; i < 26; i++) spawn("party");
    confetti(90);
    sfx.fanfare();
    const champ = $("champ");
    champ.innerHTML = [..."풍선 대장!"].map((ch, i) => ch === " " ? "<span>&nbsp;</span>" : `<span style="animation-delay:${i * 0.07}s">${ch}</span>`).join("");
    $("finalScore").textContent = score;
    const parts = [`<span>터뜨린 풍선 <b>${popped}</b>개</span>`, `<span>금색 별풍선 <b>${stars}</b>개</span>`, `<span>놓친 풍선 <b>${missed}</b>개</span>`];
    if (todayColor) parts.push(`<span>앗! 실수 <b>${mistakes}</b>번</span>`);
    $("stats").innerHTML = parts.join("");
    show("end", true);
    setTimeout(() => { if (state === "end") champ.classList.add("dance"); }, 1400);
  }
  function goHome() {
    state = "menu"; balloons = []; bits = []; texts = [];
    show("end", false); show("hud", false); show("menu", true);
    timeBox.classList.remove("hurry");
  }

  function pop(i) {
    const b = balloons[i];
    const x = bx(b), y = b.y;
    balloons.splice(i, 1);
    const c = COLORS[b.color];
    let delta;
    if (b.color === "gold") {
      delta = 3; stars++;
      burst(x, y, "gold", 30);
      say(x, y - 6, "펑!", c.dark, R * 1.2, 0, -0.08);
      say(x, y + R * 0.95, "+3점", "#ff6fa5", R * 0.85, 0.08);
      sfx.star();
    } else if (todayColor && b.color !== todayColor) {
      delta = -1; mistakes++;
      burst(x, y, b.color, 12);
      say(x, y - 6, "앗!", "#ff3b4f", R * 1.25, 0, 0.1);
      say(x, y + R * 0.95, "-1점", "#ff3b4f", R * 0.8, 0.08);
      sfx.oops();
    } else {
      delta = 1;
      burst(x, y, b.color, 16);
      say(x, y - 6, "펑!", c.dark, R * 1.1, 0, rand(-0.12, 0.12));
      say(x, y + R * 0.9, "+1점", "#1d3557", R * 0.7, 0.08);
      sfx.pop();
    }
    popped++;
    score = Math.max(0, score + delta);
    renderScore(delta < 0 ? "shake" : "bump");
  }

  cv.addEventListener("pointerdown", (e) => {
    if (state !== "play") return;
    e.preventDefault();
    const px = e.clientX, py = e.clientY;
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      if (b.party || b.deco) continue;
      const dx = (px - bx(b)) / (b.r * 1.2), dy = (py - b.y) / (b.r * 1.18 * 1.2);
      if (dx * dx + dy * dy <= 1) { pop(i); return; }
    }
  });

  // ---------- main loop ----------
  let last = performance.now(), decoTimer = 0;
  function update(dt) {
    now += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 140) { c.x = -160; c.y = rand(H * 0.12, H * 0.7); } }

    if (state === "play") {
      timeLeft -= dt;
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawn("game"); spawnTimer = SPEEDS[speed].spawn * rand(0.7, 1.25); }
      if (timeLeft <= 0) endGame();
      renderTime();
    } else if (state === "menu") {
      decoTimer -= dt;
      if (decoTimer <= 0 && balloons.length < 12) { spawn("deco"); decoTimer = rand(0.8, 1.6); }
    } else if (state === "end") {
      partyAge += dt; partyTimer -= dt;
      if (partyTimer <= 0) { spawn("party"); partyTimer = partyAge < 3 ? 0.06 : 0.3; }
      if (partyAge > 1.2 && partyAge < 1.3) confetti(4);
    }

    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      b.y -= b.vy * dt; b.phase += b.wspd * dt;
      if (b.y + b.r * 1.18 + b.r * 1.7 < 0) {
        balloons.splice(i, 1);
        if (state === "play" && !b.party && !b.deco) { missed++; missNum.textContent = missed; }
      }
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i];
      p.life -= dt;
      if (p.life <= 0) { bits.splice(i, 1); continue; }
      p.vy += (p.slow ? 40 : 900) * dt; p.vx *= p.slow ? 1 : 0.985;
      if (p.slow) p.vx += Math.sin(now * 3 + p.rot) * 30 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.life -= dt;
      if (t.life <= 0) { texts.splice(i, 1); continue; }
      if (t.max - t.life > 0) t.y += t.vy * dt;
    }
  }
  function draw() {
    drawSky();
    for (const b of balloons) drawBalloon(b);
    drawBits();
    drawTexts();
  }
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- buttons ----------
  function setSpeed(s) {
    speed = s;
    $("spSlow").setAttribute("aria-pressed", String(s === "slow"));
    $("spNormal").setAttribute("aria-pressed", String(s === "normal"));
    try { localStorage.setItem("balloon.speed", s); } catch (e) {}
  }
  $("spSlow").addEventListener("click", () => setSpeed("slow"));
  $("spNormal").addEventListener("click", () => setSpeed("normal"));
  $("pickBtn").addEventListener("click", () => show("picker", true));
  document.querySelectorAll("#picker [data-color]").forEach((btn) => btn.addEventListener("click", () => {
    todayColor = btn.dataset.color || null;
    renderToday(); show("picker", false);
    try { localStorage.setItem("balloon.today", todayColor || ""); } catch (e) {}
  }));
  $("picker").addEventListener("click", (e) => { if (e.target.id === "picker") show("picker", false); });
  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("homeBtn").addEventListener("click", goHome);
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    $("soundBtn").textContent = soundOn ? "소리 켜짐" : "소리 꺼짐";
    if (soundOn) sfx.beep(true);
  });

  // QR
  if (!GAME_URL || !QR_SRC) $("qrBtn").hidden = true;
  $("qrImg").src = QR_SRC;
  $("qrUrl").textContent = GAME_URL;
  $("qrBtn").addEventListener("click", () => show("qr", true));
  $("qrClose").addEventListener("click", () => show("qr", false));
  $("qr").addEventListener("click", (e) => { if (e.target.id === "qr") show("qr", false); });
  $("copyBtn").addEventListener("click", () => {
    const btn = $("copyBtn");
    const done = () => { btn.textContent = "복사했어요!"; setTimeout(() => (btn.textContent = "주소 복사하기"), 1600); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents($("qrUrl"));
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "주소를 길게 눌러 복사하세요";
    };
    try { navigator.clipboard.writeText(GAME_URL).then(done, fallback); } catch (e) { fallback(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { show("picker", false); show("qr", false); }
  });

  // restore per-viewer choices
  try {
    const s = localStorage.getItem("balloon.speed"); if (s === "slow" || s === "normal") setSpeed(s);
    const c = localStorage.getItem("balloon.today"); if (c && COLORS[c] && c !== "gold") todayColor = c;
  } catch (e) {}
  renderToday();

  resize();
  // a few balloons already in the sky on the first frame
  for (let i = 0; i < 7; i++) { spawn("deco"); balloons[balloons.length - 1].y = rand(H * 0.15, H * 0.95); }
  if (document.fonts && document.fonts.load) document.fonts.load("40px Jua").catch(() => {});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
